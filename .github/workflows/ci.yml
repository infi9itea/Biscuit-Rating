name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e .[test]

      # Validates the hand-maintained data, then reruns every stage of the
      # dependency graph whose inputs changed (see README.md).
      - name: Update generated data
        run: iupc update

      - name: Test
        run: python -m pytest

      - name: Show generated changes
        run: git status --short

      # Only pushes to the default branch commit the regenerated data back.
      # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
      - name: Commit generated data
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git add parser/output performance_calculator/output score_calculator/output rating_calculator/output iupc/state.json
          if git diff --cached --quiet; then
            echo "Generated data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated data"
          git push
