[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iupc-rating"
version = "0.2.0"
description = "Parse contest standings, rate institutions, and distribute contest slots."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "pandas",
    "xlsxwriter",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
iupc = "iupc.cli:main"

[tool.setuptools]
packages = [
    "iupc",
    "parser",
    "performance_calculator",
    "score_calculator",
    "rating_calculator",
    "slot_distributor",
    "institution_finder",
    "contests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
